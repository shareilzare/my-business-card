<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My business card </title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wgh@300;400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <div class="card">

        <!--header-->
        <div class="card-header">
            <div class="lang">
                <a href="persian.html" class="lang-btn">fa</a>
            </div>
            <div class="avatar">🧑‍💻</div>
            <div class="name">shareil </div>
            <div class="job-title"> Web designer and developer </div>
        </div>

        <!--body-->
        <div class="card-body">

            <!--skills-->
            <p class="section-title"> Skills </p>
            <div class="skills">
                <div class="skill-item">
                    <div class="skill-header">
                        <span class="skill-name">HTML</span>
                        <span class="skill-pct">90%</span>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-fill" data-width="90"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-header">
                        <span class="skill-name">CSS</span>
                        <span class="skill-pct">80%</span>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-fill" data-width="80"></div>
                    </div>
                </div>

                <div class="skill-item">
                    <div class="skill-header">
                        <span class="skill-name">JavaScript</span>
                        <span class="skill-pct">70%</span>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-fill" data-width="70"></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-header">
                        <span class="skill-name">Python</span>
                        <span class="skill-pct">80%</span>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-fill" data-width="80"></div>
                    </div>
                </div>


            </div>

            <!--social network -->
            <p class="section-title">Communication</p>
            <dir class="social-row">
                <a href="" class="social-btn">Instagram</a>
                <a href="" class="social-btn">LinkedIn</a>
                <a href="" class="social-btn">Telegram</a>
            </dir>

            <!--contact-->
            <a href="" class="contact-btn"> Contact me </a>
        </div>
    </div>

    <script src="script.js"></script>


</body>
</html>
